<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Admin (อาจารย์รายวิชา)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main-output.css">
  <style>
    .filter-select {
      height: 36px;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #D1D5DB;
      background: #fff;
      color: #374151;
      cursor: pointer;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .filter-select:focus {
      outline: none;
      border-color: #1541D2;
      box-shadow: 0 0 0 2px rgba(21,65,210,0.1);
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      background: #F8FAFC;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .filter-bar label {
      font-size: 12px;
      font-weight: 600;
      color: #6B7280;
      white-space: nowrap;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: #D1D5DB;
      margin: 0 4px;
    }
    .data-table {
      table-layout: fixed;
      width: 100%;
    }
    .filter-select:disabled { opacity: 0.5; cursor: not-allowed; }

    th.sortable {
      padding: 8px 12px;
      text-align: left;
      background: #F8FAFC;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background 0.15s;
    }
    th.sortable:hover {
      background: #E0E7FF;
    }
    th.sortable .sort-hint {
      color: #9CA3AF;
      font-size: 11px;
    }
    th.sortable:hover .sort-hint {
      color: #1541D2;
    }
    th.sortable.active {
      background: #DBEAFE;
      color: #1541D2;
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="main-content" style="max-width:1400px; margin: 0 auto;">
    <h1 style="font-family:Prompt,sans-serif; font-size:22px; font-weight:600; margin:16px 0;">
      รายงานการใช้งานเว็บไซต์ (Google Analytics)
    </h1>

    <div class="filter-bar">
      <label for="reportType">รายงาน</label>
      <select id="reportType" class="filter-select">
        <option value="pageviews">Page views รายหน้า (รายวัน)</option>
        <option value="daily">ผู้ใช้/เซสชัน รายวัน</option>
        <option value="events">จำนวน Event</option>
      </select>

      <label for="startDate">ตั้งแต่</label>
      <input type="date" id="startDate" class="filter-select" />
      <label for="endDate">ถึง</label>
      <input type="date" id="endDate" class="filter-select"/>

      <label for="formatType">รูปแบบ</label>
      <select id="formatType" class="filter-select">
        <option value="xlsx">Excel (.xlsx)</option>
        <option value="csv">CSV</option>
      </select>
      <button id="downloadBtn" class="filter-select" style=" background: linear-gradient(180deg, #1541D2, #0B2268); color: #fff; box-shadow: 0 4px 16px rgba(21, 65, 210, 0.3);">
        ดาวน์โหลดรายงาน(report)
      </button>
    </div>

    <div>
      <h2 style="font-family:Prompt,sans-serif; font-size:18px; font-weight:600; margin:16px 0;">รายงานจำนวนผู้ใช้</h2>
      <button type="button" class="filter-select" data-range="1">เมื่อวาน</button>
      <button type="button" class="filter-select" data-range="7">7 วันล่าสุด</button>
      <button type="button" class="filter-select" data-range="30">30 วันล่าสุด</button>
    </div>
      
    <p id="reportMsg" style="font-size:13px; color:#6B7280; margin-bottom: 12xp;"></p>

    <div id="previewWrap" style="overflow-x:auto; background:#fff; border:1px solid #E5E7EB; border-radius:12px; display:none; margin-top: auto;">
      <table class="data-table" id="previewTable" style="border-collapse:collapse; font-size:13px; min-width:640px;"></table>
    </div>

    <div id="pager" style="display:none; align-items:center; justify-content:center; gap:12px; margin:12px 0;">
      <button type="button" id="prevPage" class="filter-select">‹ ก่อนหน้า</button>
      <span id="pageInfo" style="font-size:13px; color:#6B7280;"></span>
      <button type="button" id="nextPage" class="filter-select">ถัดไป ›</button>
    </div>
  </main>

  <script src="../components/header_prof.js"></script>
  <script src="../api/report.js"></script>
</body>
</html>
