  <style>
    .filter-select {
      height: 36px;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #D1D5DB;
      background: #fff;
      color: #374151;
      cursor: pointer;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .filter-select:focus {
      outline: none;
      border-color: #1541D2;
      box-shadow: 0 0 0 2px rgba(21,65,210,0.1);
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      background: #F8FAFC;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .filter-bar label {
      font-size: 12px;
      font-weight: 600;
      color: #6B7280;
      white-space: nowrap;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: #D1D5DB;
      margin: 0 4px;
    }
    .data-table {
      table-layout: fixed;
      width: 100%;
    }
  </style>
</head>
