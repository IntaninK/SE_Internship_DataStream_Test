<!DOCTYPE html>
<html lang="th">
<head>

    gtag('config', 'G-QLXMSGH9HF');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Admin (อาจารย์รายวิชา)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main-output.css">
  <style>
    .filter-select {
      height: 36px;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #D1D5DB;
      background: #fff;
      color: #374151;
      cursor: pointer;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .filter-select:focus {
      outline: none;
      border-color: #1541D2;
      box-shadow: 0 0 0 2px rgba(21,65,210,0.1);
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 12px 16px;
      background: #F8FAFC;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .filter-bar label {
      font-size: 12px;
      font-weight: 600;
      color: #6B7280;
      white-space: nowrap;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: #D1D5DB;
      margin: 0 4px;
    }
    .data-table {
      table-layout: fixed;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <main class="main-content" style="max-width:1400px; margin: 0 auto;">
    <h1 style="font-family:Prompt,sans-serif; font-size:22px; font-weight:600; margin:16px 0;">
      รายงานการใช้งานเว็บไซต์ (Google Analytics)
    </h1>

    <div class="filter-bar">
      <label for="reportType">รายงาน</label>
      <select id="reportType" class="filter-select">
        <option value="pageviews">Page views รายหน้า (รายวัน)</option>
        <option value="daily">ผู้ใช้/เซสชัน รายวัน</option>
        <option value="events">จำนวน Event</option>
      </select>

      <label for="startDate">ตั้งแต่</label>
      <input type="date" id="startDate" class="filter-select" />
      <label for="endDate">ถึง</label>
      <input type="date" id="endDate" class="filter-select"/>

      <button id="downloadBtn" class="filter-select" style=" background: linear-gradient(180deg, #1541D2, #0B2268); color: #fff; box-shadow: 0 4px 16px rgba(21, 65, 210, 0.3);">
        ดาวน์โหลด CSV
      </button>
    </div>

    <p id="reportMsg" style="font-size:13px; color:#6B7280;"></p>
  </main>

  <script src="../components/header_prof.js"></script>
  <script src="../api/report.js"></script>
</body>
</html>
